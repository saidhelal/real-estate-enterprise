components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    OkResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    AuthSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }

    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    CurrentUser:
      type: object
      required: [id, username, fullName, email, roles, permissions]
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }

    User:
      type: object
      required: [id, username, fullName, email, status, isActive, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive, locked] }
        isActive: { type: boolean }
        lastLoginAt: { type: ["string", "null"] }
        failedAttempts: { type: integer }
        companyId: { type: ["string", "null"] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string }
        updatedAt: { type: ["string", "null"] }

    UserInput:
      type: object
      required: [username, fullName, email, password]
      properties:
        username: { type: string, minLength: 3 }
        fullName: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        password: { type: string, minLength: 8 }
        companyId: { type: string }
        roleIds:
          type: array
          items: { type: string }

    UserUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        companyId: { type: ["string", "null"] }
        roleIds:
          type: array
          items: { type: string }

    UserStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, inactive, locked] }

    Permission:
      type: object
      required: [id, code, module, description]
      properties:
        id: { type: string }
        code: { type: string }
        module: { type: string }
        description: { type: string }

    Role:
      type: object
      required: [id, name, description, isSystem, permissions, userCount, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        isSystem: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        userCount: { type: integer }
        createdAt: { type: string }

    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }

    RoleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
